name: author policy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-author:
    runs-on: ubuntu-latest
    steps:
      - name: check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: require the repository owner as author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected_name='haaakez'
          expected_email='matviy.zakrevskyi@gmail.com'

          while IFS= read -r commit; do
            author_name="$(git show -s --format='%an' "$commit")"
            author_email="$(git show -s --format='%ae' "$commit")"
            message="$(git show -s --format='%B' "$commit")"

            test "$author_name" = "$expected_name" || {
              echo "invalid author name in $commit: $author_name"
              exit 1
            }
            test "$author_email" = "$expected_email" || {
              echo "invalid author email in $commit: $author_email"
              exit 1
            }
            ! printf '%s\n' "$message" | grep -qi '^Co-authored-by:' || {
              echo "co-author trailer found in $commit"
              exit 1
            }
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
